<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>

  <!-- CAD 图纸符号 -->
  <g transform="translate(128, 110)" fill="none" stroke="#fff" stroke-width="6">
    <!-- 图纸外框 -->
    <rect x="-55" y="-45" width="110" height="90" rx="4"/>

    <!-- 内部线条 -->
    <line x1="-35" y1="-25" x2="35" y2="-25"/>
    <line x1="-35" y1="-5" x2="25" y2="-5"/>
    <line x1="-35" y1="15" x2="15" y2="15"/>

    <!-- 版本箭头 -->
    <path d="M 40 -35 L 55 -20 L 40 -5" stroke-width="5"/>
    <line x1="55" y1="-35" x2="55" y2="-5" stroke-width="5"/>
  </g>

  <!-- 版本号 V 标记 -->
  <text x="128" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#4ecca3">V</text>
</svg>
